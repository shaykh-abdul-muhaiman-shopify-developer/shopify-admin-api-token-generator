name: Bug report
description: Report a reproducible problem without sharing credentials.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Never include Client Secrets, access tokens, refresh tokens, authorization codes, full callback URLs or private store data. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the setup and the exact step that failed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error message
      description: Remove all secrets and private identifiers.
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: app-type
    attributes:
      label: App type and distribution method
      description: Do not include credentials or private account identifiers.
